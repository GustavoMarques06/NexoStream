# /etc/nats/nats-server.conf — management network only.
listen: 10.10.0.10:4222
http: 127.0.0.1:8222

jetstream {
  store_dir: /var/lib/nats/jetstream
  max_file_store: 20G
}

# TLS (required outside the lab).
# tls {
#   cert_file: /etc/nats/tls/server.crt
#   key_file:  /etc/nats/tls/server.key
#   ca_file:   /etc/nats/tls/ca.crt
# }

# Per-node credentials (operator/account JWT with nsc) let a node be revoked
# without affecting the others. See docs/deployment.md section 10.
# operator: /etc/nats/operator.jwt
# resolver: { type: full, dir: /var/lib/nats/jwt }

max_payload: 1MB
write_deadline: "10s"
