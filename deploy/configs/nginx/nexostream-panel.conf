# /etc/nginx/sites-available/nexostream-panel — panel and API on the
# management network, with TLS.
server {
    listen 443 ssl http2;
    server_name panel.nexostream.local;

    ssl_certificate     /etc/nexostream/tls/panel.crt;
    ssl_certificate_key /etc/nexostream/tls/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    root /usr/share/nexostream/panel;

    location /api/v1/stream/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        client_max_body_size 1m;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    server_name panel.nexostream.local;
    return 301 https://$host$request_uri;
}
