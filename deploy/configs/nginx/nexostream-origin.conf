# /etc/nginx/sites-available/nexostream-origin — HLS and MPEG-TS origin of a
# Media Node (distribution network). Use HTTPS in production and restrict
# Access-Control-Allow-Origin to the player domains.

# Worker media server: HLS (sessions, auth, DRM), MPEG-TS relay and DVR.
upstream nexostream_ts_relay {
    server 127.0.0.1:9501;
    keepalive 64;
}

server {
    listen 80;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nexostream/tls/origin.crt;
    # ssl_certificate_key /etc/nexostream/tls/origin.key;
    server_name _;

    root /var/lib/nexostream/hls;
    access_log /var/log/nginx/nexostream-origin.log combined buffer=64k flush=5s;

    # Live HLS is served by the worker (ADR 0009): it applies the access
    # rules of the channel (auth backend, IP lists, session limit), counts
    # play sessions and encrypts channels with DRM. The viewer address is
    # passed in X-Real-IP (trusted only from this local nginx).
    location ~ ^/[a-z0-9][a-z0-9-]*/(index\.m3u8|thumb\.jpg|dash/(index\.mpd|[A-Za-z0-9_-]+\.m4s)|(v[0-9]+/)?(index\.m3u8|seg_[0-9]+\.ts|enc/seg_[0-9]+\.ts|keys/[0-9]+\.key))$ {
        proxy_pass http://nexostream_ts_relay/hls$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
    }

    # Continuous MPEG-TS over HTTP, relayed by the worker.
    location ~ ^/([a-z0-9][a-z0-9-]*)/stream\.ts$ {
        proxy_pass http://nexostream_ts_relay/live/$1/stream.ts$is_args$args;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        add_header Access-Control-Allow-Origin "*";
    }

    # DVR (timeshift, catch-up, Flussonic-style index-<from>-<duration>.m3u8),
    # recorded and served by this node.
    location /dvr/ {
        proxy_pass http://nexostream_ts_relay;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        return 404;
    }
}
