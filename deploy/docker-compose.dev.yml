# Development infrastructure for the real binaries (not for production):
#   docker compose -f deploy/docker-compose.dev.yml up -d
# Then run nexostream-api, nexostream-controller and nexostream-worker with
# deploy/dev.env (see README, "Stack completa").
name: nexostream-dev

services:
  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_DB: nexostream
      POSTGRES_USER: nexostream
      POSTGRES_PASSWORD: nexostream-dev-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexostream"]
      interval: 5s

  redis:
    image: redis:7.4.1
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["127.0.0.1:6379:6379"]

  nats:
    image: nats:2.10.22
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [natsdata:/data]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./configs/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/rules:/etc/prometheus/rules:ro
    extra_hosts: ["host.docker.internal:host-gateway"]

  loki:
    image: grafana/loki:3.3.0
    ports: ["127.0.0.1:3100:3100"]

  grafana:
    image: grafana/grafana:11.3.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards/nexostream:ro

volumes:
  pgdata:
  natsdata:
